<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Landing page interativa para explorar as cores do MacBook Air." />
        <title>Laptop Landing Page</title>
        <link rel="stylesheet" href="./src/styles/main.css" />
    </head>

    
    <body>
        <main>
            <div class="container">
                <nav>
                    <img src="./src/image/logo.png" class="logo" alt="Logo" />
                </nav>
                <div class="content">
                    <h1>Escolha seu novo laptop</h1>
                    <h2>MacBook Air</h2>
                    <div class="background-image">
                        <img src="./src/image/macbook-air-spacegray.jfif" alt="MacBook Air na cor cinza-espacial" />
                    </div>
                    <p>
                        Há poder no silêncio. Graças à eficiência do novo chip,
                        o MacBook Air oferece um desempenho incrível sem ventilador.
                        Por isso, permanece completamente silencioso, independentemente da intensidade da tarefa.
                    </p>

                    <h3>Escolha uma Cor</h3>
                    
                    <div class="color-select" aria-label="Selecione a cor do MacBook Air">
                        <button type="button" id="midnight" aria-label="Meia-noite" aria-pressed="false"></button>
                        <button type="button" id="starlight" aria-label="Estelar" aria-pressed="false"></button>
                        <button type="button" id="spacegray" aria-label="Cinza-espacial" aria-pressed="true"></button>
                        <button type="button" id="silver" aria-label="Prateado" aria-pressed="false"></button>
                    </div>
                    <!-- Botão de compra adicionado abaixo -->
                    <a href="/" class="buy-button" role="button" aria-label="Comprar">Comprar</a>
                </div>
            </div>
        </main>
        <script src="./src/scripts/main.js"></script>
    </body>
</html>
